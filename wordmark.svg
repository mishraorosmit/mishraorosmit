<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 64" fill="none" width="500" height="64">
  <defs>
    <style>
      .display {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.03em;
        fill: #111827;
      }
      .indicator {
        fill: #c89b58;
      }
      @media (prefers-color-scheme: dark) {
        .display {
          fill: #f3f4f6;
        }
      }
    </style>
  </defs>
  
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    <animateTransform attributeName="transform" type="translate" from="0, 5" to="0, 0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    
    <text x="240" y="44" text-anchor="middle" class="display">OROSMIT MISHRA</text>
    
    <circle cx="446" cy="22" r="3" class="indicator">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>

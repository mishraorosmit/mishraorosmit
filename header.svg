<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" fill="none" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .title {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.03em;
        fill: #ffffff;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.12em;
        fill: #717684;
        text-transform: uppercase;
      }
      .subtext {
        font-size: 13.5px;
        letter-spacing: -0.01em;
        fill: #9ca3af;
      }
      .accent {
        fill: #38bdf8;
      }
      .hairline {
        stroke: #1e222e;
        stroke-width: 1;
      }
      .corner {
        stroke: #38bdf8;
        stroke-width: 1.5;
      }
    </style>

    <!-- Ambient background glows -->
    <radialGradient id="glow-sapphire" cx="15%" cy="20%" r="65%">
      <animate attributeName="cx" values="15%;30%;15%" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="20%;45%;20%" dur="22s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#0f213d" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#0b1322" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#07080b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-amber" cx="85%" cy="80%" r="60%">
      <animate attributeName="cx" values="85%;70%;85%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80%;55%;80%" dur="24s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#2a1b10" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#140d08" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07080b" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Dot Matrix Pattern -->
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#ffffff" fill-opacity="0.065" />
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="920" height="230" fill="#07080b" rx="6" />

  <!-- Animated Ambient Glow Layers -->
  <rect width="920" height="230" fill="url(#glow-sapphire)" rx="6" />
  <rect width="920" height="230" fill="url(#glow-amber)" rx="6" />

  <!-- Dot Matrix Overlay -->
  <rect width="920" height="230" fill="url(#dot-grid)" rx="6" />

  <!-- Outer Structural Frame -->
  <rect x="0.5" y="0.5" width="919" height="229" fill="none" class="hairline" rx="6" />

  <!-- Corner Tech Accents -->
  <path d="M 0.5 16 L 0.5 0.5 L 16 0.5" fill="none" class="corner" />
  <path d="M 903.5 0.5 L 919.5 0.5 L 919.5 16" fill="none" class="corner" />
  <path d="M 0.5 213.5 L 0.5 229.5 L 16 229.5" fill="none" class="corner" />
  <path d="M 903.5 229.5 L 919.5 229.5 L 919.5 213.5" fill="none" class="corner" />

  <!-- Horizontal Divider Guides -->
  <line x1="36" y1="44" x2="884" y2="44" class="hairline" />
  <line x1="36" y1="184" x2="884" y2="184" class="hairline" />

  <!-- Floating Micro-Particles -->
  <circle cx="180" cy="130" r="1.2" fill="#38bdf8" opacity="0.35">
    <animate attributeName="cy" values="130;105;130" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="720" cy="90" r="1.5" fill="#f59e0b" opacity="0.3">
    <animate attributeName="cy" values="90;115;90" dur="15s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="15s" repeatCount="indefinite" />
  </circle>
  <circle cx="510" cy="160" r="1.0" fill="#ffffff" opacity="0.25">
    <animate attributeName="cy" values="160;135;160" dur="14s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Top Metadata Bar -->
  <circle cx="44" cy="26" r="3.5" class="accent">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="56" y="30" class="mono label">SYS.ID // OM-21</text>
  <text x="210" y="30" class="mono label">RESEARCH &amp; SYSTEMS</text>
  <text x="884" y="30" text-anchor="end" class="mono label">20.2961° N, 85.8245° E</text>

  <!-- Central Block: Identity -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
    <animateTransform attributeName="transform" type="translate" from="0, 4" to="0, 0" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />

    <text x="40" y="98" class="sans title">OROSMIT MISHRA</text>
    <text x="40" y="130" class="sans subtext">Studying Computer Science (AI &amp; ML) at ITER SOA.</text>
    <text x="40" y="152" class="sans subtext">Building browser-side video engines and medical data systems.</text>
  </g>

  <!-- Bottom Metadata Bar -->
  <text x="40" y="206" class="mono label">BASE // BHUBANESWAR, IN</text>
  <text x="884" y="206" text-anchor="end" class="mono label">AFFILIATION // ITER SOA &#183; ACTIVE RUNTIME</text>
</svg>
